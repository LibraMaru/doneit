  // Make a horizontally-overflowing element scrollable by mouse drag and
  // by mouse wheel / trackpad two-finger swipe (vertical → horizontal).
  function enableHorizontalScroll(el) {
    if (!el) return;
    let isDown = false, startX = 0, scrollStart = 0, moved = 0;
    el.addEventListener('mousedown', (e) => {
      isDown = true; moved = 0;
      startX = e.pageX - el.offsetLeft;
      scrollStart = el.scrollLeft;
      el.classList.add('dragging');
    });
    el.addEventListener('mouseleave', () => { isDown = false; el.classList.remove('dragging'); });
    el.addEventListener('mouseup',    () => { isDown = false; el.classList.remove('dragging'); });
    el.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      const x = e.pageX - el.offsetLeft;
      const dx = x - startX;
      moved = Math.abs(dx);
      el.scrollLeft = scrollStart - dx;
    });
    el.addEventListener('click', (e) => {
      if (moved > 5) { e.stopPropagation(); e.preventDefault(); }
    }, true);
    // Wheel: convert vertical scroll into horizontal so trackpads work
    el.addEventListener('wheel', (e) => {
      const dx = e.deltaX;
      const dy = e.deltaY;
      // Only intercept if vertical motion is the dominant axis (trackpad swipe up/down)
      if (Math.abs(dy) > Math.abs(dx)) {
        // Don't preventDefault if the strip can't scroll further — let the page handle it
        const max = el.scrollWidth - el.clientWidth;
        if ((dy > 0 && el.scrollLeft < max) || (dy < 0 && el.scrollLeft > 0)) {
          e.preventDefault();
          el.scrollLeft += dy;
        }
      }
    }, { passive: false });
  }

  // Detect mobile / Safari — these need redirect-based sign-in because
  // third-party popups are blocked or unreliable on iOS.
  function shouldUseRedirect() {
    const ua = navigator.userAgent || '';
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const isAndroid = /Android/i.test(ua);
    const isSafari = /^((?!chrome|android).)*safari/i.test(ua);
    return isIOS || isAndroid || isSafari;
  }

  async function handleSignIn() {
    if (!window.fb) { alert('Sign-in not ready yet, please try again in a moment.'); return; }
    try {
      if (shouldUseRedirect()) {
        // Full-page redirect to Google. After auth, Google redirects back here
        // and getRedirectResult() picks it up on next page load.
        await window.fb.signInRedirect();
        // Page will navigate away here; nothing else to do.
      } else {
        await window.fb.signInPopup();
      }
    } catch (err) {
      console.error('Sign-in error:', err);
      const ignorable = ['auth/popup-closed-by-user', 'auth/cancelled-popup-request', 'auth/popup-blocked'];
      if (err && err.code === 'auth/popup-blocked') {
        // Popup got blocked even on desktop — fall back to redirect
        try { await window.fb.signInRedirect(); } catch (e) { console.error('Redirect fallback failed:', e); }
      } else if (err && !ignorable.includes(err.code)) {
        alert('Could not sign in. Please try again.');
      }
    }
  }

  async function handleSignOut() {
    if (!window.fb) return;
    try { await window.fb.signOut(); }
    catch (err) { console.error('Sign-out error:', err); }
  }

  function startProfileListener() {
    const ref = profileDocRef();
    if (!ref) return;
    unsubscribeProfile = window.fb.onSnapshot(ref, (snap) => {
      if (snap.exists()) {
        const data = snap.data();
        userProfile = (data && data.emoji) ? { emoji: data.emoji, bg: data.bg || '#DE6D20' } : null;
      } else {
        userProfile = null;
      }
      renderAccountAvatar();
    }, (err) => {
      console.error('Profile listener error:', err);
    });
  }
  function stopProfileListener() {
    if (unsubscribeProfile) { unsubscribeProfile(); unsubscribeProfile = null; }
  }

  async function saveProfile(profile) {
    const ref = profileDocRef();
    if (!ref) return;
    if (profile === null) {
      // Revert to Google photo: delete the doc
      try { await window.fb.deleteDoc(ref); }
      catch (e) { console.error('Profile revert failed:', e); }
    } else {
      try { await window.fb.setDoc(ref, profile); }
      catch (e) { console.error('Profile save failed:', e); }
    }
  }

  function openAvatarPicker() {
    if (!currentUser) return;
    // Pre-fill with current selection or sensible default
    if (userProfile && userProfile.emoji) {
      draftAvatar = { emoji: userProfile.emoji, bg: userProfile.bg || '#DE6D20' };
    } else {
      draftAvatar = { emoji: EMOJI_OPTIONS[0], bg: BG_OPTIONS[0] };
    }
    renderAvatarPicker();
    openSheet(document.getElementById('avatar-sheet'));
  }

  function renderAvatarPicker() {
    const previewCircle = document.getElementById('avatar-preview-circle');
    previewCircle.textContent = draftAvatar.emoji;
    previewCircle.style.background = draftAvatar.bg;

    const emojiRow = document.getElementById('emoji-row');
    emojiRow.innerHTML = EMOJI_OPTIONS.map(e =>
      `<button class="emoji-pick${e === draftAvatar.emoji ? ' selected' : ''}" data-emoji="${e}">${e}</button>`
    ).join('');
    emojiRow.querySelectorAll('.emoji-pick').forEach(btn => {
      btn.addEventListener('click', () => {
        draftAvatar.emoji = btn.getAttribute('data-emoji');
        renderAvatarPicker();
      });
    });

    const bgRow = document.getElementById('avatar-bg-row');
    bgRow.innerHTML = BG_OPTIONS.map(c =>
      `<button class="bg-pick${c.toUpperCase() === draftAvatar.bg.toUpperCase() ? ' selected' : ''}" data-bg="${c}" style="background:${c}"></button>`
    ).join('');
    bgRow.querySelectorAll('.bg-pick').forEach(btn => {
      btn.addEventListener('click', () => {
        draftAvatar.bg = btn.getAttribute('data-bg');
        renderAvatarPicker();
      });
    });

    enableHorizontalScroll(emojiRow);
    enableHorizontalScroll(bgRow);
  }

  document.getElementById('signin-btn').addEventListener('click', handleSignIn);
  document.getElementById('signin-btn-2').addEventListener('click', handleSignIn);
  document.getElementById('signout-btn').addEventListener('click', handleSignOut);

  // Tap the avatar in the account card to open the picker
  document.getElementById('account-avatar').addEventListener('click', openAvatarPicker);
  // Tap the small avatar in the topbar to open the picker directly
  document.getElementById('topbar-avatar').addEventListener('click', openAvatarPicker);

  document.getElementById('avatar-cancel').addEventListener('click', closeSheets);
  document.getElementById('avatar-save').addEventListener('click', async () => {
    userProfile = { ...draftAvatar };
    renderAccountAvatar();
    closeSheets();
    await saveProfile(userProfile);
  });
  document.getElementById('avatar-revert').addEventListener('click', async () => {
    userProfile = null;
    renderAccountAvatar();
    closeSheets();
    await saveProfile(null);
  });

  function bootAuth() {
    if (!window.fb) return;

    // If we just came back from a Google redirect sign-in, this resolves with
    // the user. The onAuthChange handler will then fire normally.
    window.fb.getRedirectResult().catch((err) => {
      // Common when there's no pending redirect — silent.
      if (err && err.code && err.code !== 'auth/no-auth-event') {
        console.error('Redirect result error:', err);
      }
    });

    window.fb.onAuthChange(async (user) => {
      const wasSignedOut = !currentUser;
      currentUser = user;
      updateAuthUI();

      // Stop any previous listeners
      stopCloudListener();
      stopProfileListener();
      stopSettingsListener();

      if (!user) {
        // Reset profile so old data doesn't leak into next sign-in
        userProfile = null;
        renderAccountAvatar();
        return;
      }

      // Migration: ask once per device, the FIRST time we ever see this user
      // signed in here. Subsequent reloads just restore the session quietly.
      const migrationKey = 'tasks.migrated.' + user.uid;
      const alreadyMigrated = localStorage.getItem(migrationKey) === '1';

      if (!alreadyMigrated && tasks.length > 0) {
        const wantsMigrate = confirm(
          `You have ${tasks.length} task${tasks.length === 1 ? '' : 's'} on this device. ` +
          `Import ${tasks.length === 1 ? 'it' : 'them'} into your account so they sync across devices?`
        );
        if (wantsMigrate) {
          try { await pushAllToCloud(); }
          catch (e) { console.error('Migration push failed:', e); }
        } else {
          // User said no — clear local so cloud is the source of truth
          tasks = [];
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          render();
        }
        // Mark migration as resolved either way so we never ask again on this device
        localStorage.setItem(migrationKey, '1');
      } else if (!alreadyMigrated) {
        // No local tasks but first sign-in — still mark as migrated
        localStorage.setItem(migrationKey, '1');
      }

      // Start listening for cloud changes
      startCloudListener();
      startProfileListener();
      startSettingsListener();
    });
  }

  // Firebase loads asynchronously; wait for ready event if not yet attached
  if (window.fb) bootAuth();
  else window.addEventListener('firebase-ready', bootAuth, { once: true });

  // Mouse drag-to-scroll for date filters (desktop). Mobile already
  // supports horizontal swipe natively via overflow-x.
  (function enableDragScroll() {
    const el = document.getElementById('date-filters');
    if (!el) return;
    let isDown = false, startX = 0, scrollStart = 0, moved = 0;
    el.addEventListener('mousedown', (e) => {
      isDown = true; moved = 0;
      startX = e.pageX - el.offsetLeft;
      scrollStart = el.scrollLeft;
      el.classList.add('dragging');
    });
    el.addEventListener('mouseleave', () => { isDown = false; el.classList.remove('dragging'); });
    el.addEventListener('mouseup', () => { isDown = false; el.classList.remove('dragging'); });
    el.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      const x = e.pageX - el.offsetLeft;
      const dx = x - startX;
      moved = Math.abs(dx);
      el.scrollLeft = scrollStart - dx;
    });
    // Prevent click on a pill if the user actually dragged
    el.addEventListener('click', (e) => {
      if (moved > 5) { e.stopPropagation(); e.preventDefault(); }
    }, true);
  })();
})();
</script>
